name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: "Install @devcontainers/cli"
        run: npm install -g @devcontainers/cli

      - name: "Validate Feature Metadata"
        run: |
          node test/auto-update/strategy-sources.js
          bash test/nerd-font/default-version.sh
          bash test/docs/opencode-and-volumes.sh
          bash test/docs/feature-ordering.sh
          bash test/docs/generated-readmes.sh

      - name: "Run Smoke Tests"
        run: devcontainer features test --skip-autogenerated --project-folder .
