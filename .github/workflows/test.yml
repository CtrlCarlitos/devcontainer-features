name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Install @devcontainers/cli"
        run: npm install -g @devcontainers/cli

      - name: "Validate Feature Metadata"
        run: |
          node test/auto-update/strategy-sources.js
          bash test/nerd-font/default-version.sh
          bash test/docs/opencode-and-volumes.sh
          bash test/docs/feature-ordering.sh
          bash test/docs/generated-readmes.sh

      - name: "Run Smoke Tests"
        run: devcontainer features test --skip-autogenerated --project-folder .
