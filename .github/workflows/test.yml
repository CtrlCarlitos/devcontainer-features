name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: "Install @devcontainers/cli"
        run: npm install -g @devcontainers/cli

      - name: "Validate Feature Metadata"
        run: |
          node test/auto-update/strategy-sources.js
          bash test/nerd-font/default-version.sh
          bash test/docs/opencode-and-volumes.sh
          bash test/docs/feature-ordering.sh
          bash test/docs/generated-readmes.sh

      - name: "Run Smoke Tests"
        run: devcontainer features test --skip-autogenerated --project-folder .
