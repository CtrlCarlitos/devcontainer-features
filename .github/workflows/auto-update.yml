name: Auto-Update

on:
  schedule:
    - cron: '0 7 * * *' # Daily at 7AM UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Dev Containers CLI
        run: npm install -g @devcontainers/cli

      - name: Check for Updates
        id: check
        run: |
          node .github/scripts/check-updates.js

      - name: Generate Docs
        if: steps.check.outputs.updated == 'true'
        run: devcontainer features generate-docs --project-folder src --namespace CtrlCarlitos/devcontainer-features

      - name: Run Tests
        if: steps.check.outputs.updated == 'true'
        run: devcontainer features test --skip-autogenerated --project-folder .

      - name: Create Pull Request
        if: steps.check.outputs.updated == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.PAT_DEVCONTAINER_FEATURES }}
          commit-message: "chore: auto-update feature versions"
          title: "chore: auto-update feature versions"
          body: "Automated version bumps for devcontainer features."
          branch: "chore/auto-update"
          delete-branch: true
          labels: "automation"
          signoff: true
          assignees: ${{ github.repository_owner }}

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_DEVCONTAINER_FEATURES }}
